<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Exam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --navy: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --muted: #8b949e;
            --text: #e6edf3;
            --amber: #f0a500;
            --amber-dim: rgba(240, 165, 0, 0.12);
            --green: #3fb950;
            --green-dim: rgba(63, 185, 80, 0.10);
            --red: #f85149;
            --red-dim: rgba(248, 81, 73, 0.10);
            --radius: 6px;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--navy);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px 80px;
            line-height: 1.6;
        }

        /* ── Header ── */
        header {
            max-width: 760px;
            margin: 0 auto 36px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .header-eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            color: var(--amber);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        header h1 {
            font-size: 26px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        header p {
            margin-top: 6px;
            font-size: 14px;
            color: var(--muted);
        }

        /* ── Container ── */
        .container {
            max-width: 760px;
            margin: 0 auto;
        }

        /* ── Upload card ── */
        .upload-card {
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 28px 24px;
            text-align: center;
            background: var(--panel);
            margin-bottom: 32px;
            transition: border-color 0.2s;
        }

        .upload-card:hover {
            border-color: var(--amber);
        }

        .upload-card label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 14px;
            cursor: pointer;
        }

        .upload-card label strong {
            color: var(--text);
        }

        .file-btn-wrapper {
            position: relative;
            display: inline-block;
        }

        #file-input {
            position: absolute;
            opacity: 0;
            inset: 0;
            cursor: pointer;
        }

        .file-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--amber-dim);
            border: 1px solid var(--amber);
            color: var(--amber);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            padding: 9px 20px;
            border-radius: var(--radius);
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: background 0.15s;
        }

        .file-btn:hover {
            background: rgba(240, 165, 0, 0.22);
        }

        .file-btn svg {
            flex-shrink: 0;
        }

        /* ── Question blocks ── */
        #quiz-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .question-block {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 24px;
            display: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .question-block:hover {
            border-color: #444c56;
        }

        /* highlight wrong questions when jumped to */
        .question-block.jump-highlight {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(248, 81, 73, 0.12);
        }

        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 16px;
        }

        .q-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            color: var(--amber);
            background: var(--amber-dim);
            border: 1px solid rgba(240, 165, 0, 0.25);
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
            margin-top: 1px;
            flex-shrink: 0;
        }

        .question-text {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            line-height: 1.55;
        }

        /* ── Options ── */
        .options {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        /* True/False stays horizontal; MCQ stacks vertically */
        .options.options-tf {
            flex-direction: row;
            flex-wrap: wrap;
        }

        .options.options-mcq {
            flex-direction: column;
            gap: 8px;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            padding: 10px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            transition: border-color 0.15s, color 0.15s, background 0.15s;
            user-select: none;
        }

        .options label:hover {
            border-color: var(--amber);
            color: var(--amber);
            background: var(--amber-dim);
        }

        .options input[type="radio"] {
            display: none;
        }

        .options label.selected {
            border-color: var(--amber);
            color: var(--amber);
            background: var(--amber-dim);
        }

        /* Option key badge (A, B, C, D) */
        .option-key {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            color: inherit;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid currentColor;
            opacity: 0.7;
            padding: 3px 9px;
            border-radius: 3px;
            flex-shrink: 0;
            min-width: 28px;
            text-align: center;
        }

        /* Correct / incorrect option colouring after grading */
        .options label.correct-answer {
            border-color: var(--green) !important;
            background: var(--green-dim) !important;
            color: #7ee787 !important;
        }

        .options label.wrong-answer {
            border-color: var(--red) !important;
            background: var(--red-dim) !important;
            color: #ffa198 !important;
        }

        /* ── Feedback ── */
        .feedback {
            display: none;
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 13.5px;
            line-height: 1.55;
        }

        .feedback.correct {
            background: var(--green-dim);
            border: 1px solid rgba(63, 185, 80, 0.3);
            color: #7ee787;
        }

        .feedback.correct strong {
            color: var(--green);
        }

        .feedback.incorrect {
            background: var(--red-dim);
            border: 1px solid rgba(248, 81, 73, 0.3);
            color: #ffa198;
        }

        .feedback.incorrect strong {
            color: var(--red);
        }

        /* ── Unanswered warning ── */
        #unanswered-warning {
            display: none;
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: var(--radius);
            background: rgba(248, 81, 73, 0.08);
            border: 1px solid rgba(248, 81, 73, 0.25);
            font-size: 13px;
            color: #ffa198;
            display: none;
            align-items: center;
            gap: 10px;
        }

        #unanswered-warning .warn-icon {
            flex-shrink: 0;
            color: var(--red);
        }

        #unanswered-warning .warn-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        #unanswered-warning .warn-text {
            flex: 1;
        }

        .warn-q-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            background: rgba(248, 81, 73, 0.12);
            border: 1px solid rgba(248, 81, 73, 0.3);
            color: #ffa198;
            padding: 2px 7px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
        }

        .warn-q-link:hover {
            background: rgba(248, 81, 73, 0.22);
            color: var(--red);
        }

        /* ── Submit button ── */
        #submit-btn {
            display: none;
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: var(--amber);
            color: #0d1117;
            border: none;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.01em;
            transition: opacity 0.15s, transform 0.1s;
        }

        #submit-btn:hover {
            opacity: 0.88;
        }

        #submit-btn:active {
            transform: scale(0.99);
        }

        /* ── Results ── */
        #results-container {
            display: none;
            margin-top: 32px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px 24px;
            text-align: center;
        }

        #results-container h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .score-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 52px;
            font-weight: 600;
            color: var(--amber);
            line-height: 1;
            margin-bottom: 8px;
        }

        .score-label {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 20px;
        }

        .score-bar-bg {
            width: 100%;
            max-width: 320px;
            height: 6px;
            background: var(--border);
            border-radius: 99px;
            margin: 0 auto 24px;
            overflow: hidden;
        }

        .score-bar-fill {
            height: 100%;
            border-radius: 99px;
            background: var(--amber);
            width: 0%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ── Jump to wrong section ── */
        #wrong-nav {
            display: none;
            margin-top: 4px;
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(248, 81, 73, 0.06);
            border: 1px solid rgba(248, 81, 73, 0.2);
            border-radius: var(--radius);
            text-align: left;
        }

        #wrong-nav .wrong-nav-header {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            color: var(--red);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        #wrong-nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .wrong-q-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            background: rgba(248, 81, 73, 0.10);
            border: 1px solid rgba(248, 81, 73, 0.28);
            color: #ffa198;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .wrong-q-link:hover {
            background: rgba(248, 81, 73, 0.22);
            color: var(--red);
            border-color: rgba(248, 81, 73, 0.5);
        }

        .results-hint {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 20px;
        }

        /* ── Results action buttons row ── */
        .results-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        /* ── Download report button ── */
        #download-report-btn {
            display: none;
            padding: 10px 22px;
            background: var(--green-dim);
            border: 1px solid var(--green);
            color: #7ee787;
            border-radius: var(--radius);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: background 0.15s, color 0.15s;
            display: none;
            align-items: center;
            gap: 8px;
        }

        #download-report-btn:hover {
            background: rgba(63, 185, 80, 0.2);
            color: var(--green);
        }

        #download-report-btn svg {
            flex-shrink: 0;
        }

        /* ── Retry button ── */
        #retry-btn {
            display: none;
            padding: 10px 22px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

        #retry-btn:hover {
            border-color: var(--text);
            color: var(--text);
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--navy);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        @media (max-width: 540px) {
            header h1 {
                font-size: 20px;
            }

            .score-display {
                font-size: 40px;
            }

            .options.options-tf {
                flex-direction: column;
            }

            .results-actions {
                flex-direction: column;
                align-items: stretch;
            }

            #download-report-btn,
            #retry-btn {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <div class="header-eyebrow">UNSW &mdash; kk</div>
            <h1>Practice Exam Environment</h1>
            <p>True / False &amp; Multiple Choice — load a question file to begin.</p>
        </header>

        <div class="upload-card">
            <label for="file-input"><strong>No questions loaded.</strong> Select a JSON file to start a session.</label>
            <div class="file-btn-wrapper">
                <input type="file" id="file-input" accept=".json">
                <div class="file-btn">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 1v9m0-9L5 4m3-3 3 3M2 11v2a1 1 0 001 1h10a1 1 0 001-1v-2" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Load question file
                </div>
            </div>
        </div>

        <div id="quiz-form"></div>

        <!-- Unanswered warning — shown above submit when blanks exist -->
        <div id="unanswered-warning">
            <svg class="warn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M8 1.5L14.5 13H1.5L8 1.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
                <path d="M8 6v3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                <circle cx="8" cy="11" r="0.75" fill="currentColor" />
            </svg>
            <div class="warn-text">
                <span id="unanswered-count-text"></span>
                <div class="warn-links" id="unanswered-links"></div>
            </div>
        </div>

        <button id="submit-btn" onclick="gradeTest()">Submit Exam</button>

        <div id="results-container">
            <h2>Session complete</h2>
            <div class="score-display"><span id="score-display">0</span> / <span id="total-display">0</span></div>
            <p class="score-label">questions answered correctly</p>
            <div class="score-bar-bg">
                <div class="score-bar-fill" id="score-bar"></div>
            </div>

            <!-- Jump to wrong questions -->
            <div id="wrong-nav">
                <div class="wrong-nav-header">Jump to incorrect answers</div>
                <div id="wrong-nav-links"></div>
            </div>

            <p class="results-hint">Scroll up to review your feedback.</p>

            <!-- Action buttons -->
            <div class="results-actions">
                <button id="download-report-btn" onclick="downloadReport()">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 1v9m0 0L5 7m3 3 3-3M2 11v2a1 1 0 001 1h10a1 1 0 001-1v-2" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Download Report
                </button>
                <button id="retry-btn" onclick="retryQuiz()">Load new file</button>
            </div>
        </div>

    </div>

    <script>
        let currentQuestions = [];
        let lastGradeResults = []; // stores grading data for report generation
        let loadedFileName = 'exam';

        const quizContainer = document.getElementById('quiz-form');
        const submitBtn = document.getElementById('submit-btn');
        const fileInput = document.getElementById('file-input');
        const resultsContainer = document.getElementById('results-container');
        const retryBtn = document.getElementById('retry-btn');
        const downloadReportBtn = document.getElementById('download-report-btn');
        const unansweredWarning = document.getElementById('unanswered-warning');
        const unansweredLinks = document.getElementById('unanswered-links');
        const unansweredCountText = document.getElementById('unanswered-count-text');

        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            loadedFileName = file.name.replace(/\.json$/i, '');

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    currentQuestions = parsed.map((q, i) => ({ ...q, id: i + 1 }));
                    renderQuiz();
                    document.querySelector('.upload-card label').innerHTML =
                        `<strong>${file.name}</strong> &mdash; ${currentQuestions.length} questions loaded.`;
                } catch (error) {
                    alert("Error parsing JSON. Please ensure the file is correctly formatted.");
                }
            };
            reader.readAsText(file);
        });

        function hexNum(index) {
            return '0x' + String(index + 1).padStart(2, '0');
        }

        function isMCQ(q) {
            return Array.isArray(q.options) && q.options.length > 0;
        }

        function buildOptionsHTML(q) {
            if (isMCQ(q)) {
                const keys = ['A', 'B', 'C', 'D'];
                const opts = q.options.slice(0, 4);
                const labelsHTML = opts.map((opt, i) => {
                    const key = keys[i];
                    return `
                        <label id="label-${key}-${q.id}">
                            <input type="radio" name="q${q.id}" value="${key}">
                            <span class="option-key">${key}</span>
                            <span>${opt}</span>
                        </label>`;
                }).join('');
                return `<div class="options options-mcq">${labelsHTML}</div>`;
            } else {
                return `
                    <div class="options options-tf">
                        <label id="label-T-${q.id}">
                            <input type="radio" name="q${q.id}" value="T">
                            <span>True</span>
                        </label>
                        <label id="label-F-${q.id}">
                            <input type="radio" name="q${q.id}" value="F">
                            <span>False</span>
                        </label>
                    </div>`;
            }
        }

        function getOptionValues(q) {
            if (isMCQ(q)) {
                return ['A', 'B', 'C', 'D'].slice(0, q.options.length);
            }
            return ['T', 'F'];
        }

        function getOptionText(q, value) {
            if (!value) return '(unanswered)';
            if (isMCQ(q)) {
                const keys = ['A', 'B', 'C', 'D'];
                const idx = keys.indexOf(value);
                if (idx !== -1 && q.options[idx] !== undefined) {
                    return `${value}: ${q.options[idx]}`;
                }
                return value;
            }
            return value === 'T' ? 'True' : 'False';
        }

        function renderQuiz() {
            quizContainer.innerHTML = '';
            resultsContainer.style.display = 'none';
            retryBtn.style.display = 'none';
            downloadReportBtn.style.display = 'none';
            unansweredWarning.style.display = 'none';
            lastGradeResults = [];

            currentQuestions.forEach((q, index) => {
                const block = document.createElement('div');
                block.className = 'question-block';
                block.id = `block-${q.id}`;
                block.style.display = 'block';
                block.innerHTML = `
                    <div class="question-header">
                        <span class="q-num">${hexNum(index)}</span>
                        <div class="question-text">${q.text}</div>
                    </div>
                    ${buildOptionsHTML(q)}
                    <div class="feedback" id="feedback-${q.id}"></div>
                `;
                quizContainer.appendChild(block);
            });

            currentQuestions.forEach(q => {
                getOptionValues(q).forEach(val => {
                    const input = document.querySelector(`input[name="q${q.id}"][value="${val}"]`);
                    if (!input) return;
                    input.addEventListener('change', () => {
                        document.querySelectorAll(`input[name="q${q.id}"]`).forEach(r => {
                            r.closest('label').classList.remove('selected');
                        });
                        input.closest('label').classList.add('selected');
                        updateUnansweredWarning();
                    });
                });
            });

            submitBtn.style.display = 'block';
            updateUnansweredWarning();
        }

        function getUnansweredIndices() {
            return currentQuestions
                .map((q, index) => ({ q, index }))
                .filter(({ q }) => !document.querySelector(`input[name="q${q.id}"]:checked`));
        }

        function updateUnansweredWarning() {
            const unanswered = getUnansweredIndices();

            if (unanswered.length === 0) {
                unansweredWarning.style.display = 'none';
                return;
            }

            const count = unanswered.length;
            unansweredCountText.textContent =
                `${count} question${count > 1 ? 's' : ''} left unanswered.`;

            unansweredLinks.innerHTML = '';
            unanswered.forEach(({ q, index }) => {
                const a = document.createElement('a');
                a.className = 'warn-q-link';
                a.textContent = hexNum(index);
                a.href = '#';
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    scrollToBlock(q.id);
                });
                unansweredLinks.appendChild(a);
            });

            unansweredWarning.style.display = 'flex';
        }

        function scrollToBlock(qId, highlight = false) {
            const block = document.getElementById(`block-${qId}`);
            if (!block) return;
            block.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (highlight) {
                block.classList.add('jump-highlight');
                setTimeout(() => block.classList.remove('jump-highlight'), 1800);
            }
        }

        function gradeTest() {
            let score = 0;
            const wrongIndices = [];
            lastGradeResults = [];

            currentQuestions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
                const feedbackDiv = document.getElementById(`feedback-${q.id}`);
                feedbackDiv.style.display = 'block';

                document.querySelectorAll(`input[name="q${q.id}"]`).forEach(r => r.disabled = true);

                if (isMCQ(q)) {
                    const correctLabel = document.getElementById(`label-${q.answer}-${q.id}`);
                    if (correctLabel) correctLabel.classList.add('correct-answer');
                    if (selected && selected.value !== q.answer) {
                        selected.closest('label').classList.add('wrong-answer');
                    }
                }

                let resultEntry = {
                    index,
                    question: q,
                    selectedValue: selected ? selected.value : null,
                    correct: false,
                    unanswered: !selected
                };

                if (!selected) {
                    feedbackDiv.className = 'feedback incorrect';
                    feedbackDiv.innerHTML = `<strong>Unanswered.</strong> ${q.explanation}`;
                    wrongIndices.push({ q, index });
                } else if (selected.value === q.answer) {
                    score++;
                    resultEntry.correct = true;
                    feedbackDiv.className = 'feedback correct';
                    feedbackDiv.innerHTML = `<strong>Correct.</strong> ${q.explanation}`;
                } else {
                    feedbackDiv.className = 'feedback incorrect';
                    feedbackDiv.innerHTML = `<strong>Incorrect.</strong> ${q.explanation}`;
                    wrongIndices.push({ q, index });
                }

                lastGradeResults.push(resultEntry);
            });

            submitBtn.style.display = 'none';
            unansweredWarning.style.display = 'none';
            resultsContainer.style.display = 'block';
            retryBtn.style.display = 'inline-flex';
            downloadReportBtn.style.display = 'inline-flex';
            document.getElementById('score-display').innerText = score;
            document.getElementById('total-display').innerText = currentQuestions.length;

            const pct = currentQuestions.length > 0 ? (score / currentQuestions.length) * 100 : 0;
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    document.getElementById('score-bar').style.width = pct + '%';
                });
            });

            const wrongNav = document.getElementById('wrong-nav');
            const wrongNavLinks = document.getElementById('wrong-nav-links');
            wrongNavLinks.innerHTML = '';

            if (wrongIndices.length > 0) {
                wrongIndices.forEach(({ q, index }) => {
                    const a = document.createElement('a');
                    a.className = 'wrong-q-link';
                    a.textContent = hexNum(index);
                    a.href = '#';
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        scrollToBlock(q.id, true);
                    });
                    wrongNavLinks.appendChild(a);
                });
                wrongNav.style.display = 'block';
            } else {
                wrongNav.style.display = 'none';
            }

            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function downloadReport() {
            if (!lastGradeResults.length) return;

            const now = new Date();
            const dateStr = now.toLocaleString();
            const score = lastGradeResults.filter(r => r.correct).length;
            const total = lastGradeResults.length;
            const pct = Math.round((score / total) * 100);

            const incorrectResults = lastGradeResults.filter(r => !r.correct);

            const divider = '='.repeat(72);
            const thinDivider = '-'.repeat(72);

            let lines = [];

            lines.push(divider);
            lines.push('  PRACTICE EXAM REPORT');
            lines.push(divider);
            lines.push(`  File     : ${loadedFileName}`);
            lines.push(`  Date     : ${dateStr}`);
            lines.push(`  Score    : ${score} / ${total}  (${pct}%)`);
            lines.push(`  Result   : ${pct >= 50 ? 'PASS' : 'FAIL'}`);
            lines.push(divider);
            lines.push('');

            if (incorrectResults.length === 0) {
                lines.push('  No incorrect answers — perfect score!');
                lines.push('');
            } else {
                lines.push(`  INCORRECT / UNANSWERED  (${incorrectResults.length} question${incorrectResults.length > 1 ? 's' : ''})`);
                lines.push('');

                incorrectResults.forEach((result, i) => {
                    const q = result.question;
                    const qLabel = hexNum(result.index);

                    lines.push(thinDivider);
                    lines.push(`  Q${i + 1}  [${qLabel}]  ${q.text}`);
                    lines.push('');

                    if (result.unanswered) {
                        lines.push(`  Your answer    : (not answered)`);
                    } else {
                        lines.push(`  Your answer    : ${getOptionText(q, result.selectedValue)}`);
                    }
                    lines.push(`  Correct answer : ${getOptionText(q, q.answer)}`);
                    lines.push('');
                    lines.push(`  Explanation    : ${q.explanation}`);
                    lines.push('');
                });
            }

            lines.push(divider);
            lines.push('  END OF REPORT');
            lines.push(divider);

            const reportText = lines.join('\n');
            const blob = new Blob([reportText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `${loadedFileName}_report_${now.toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function retryQuiz() {
            fileInput.value = '';
            loadedFileName = 'exam';
            document.querySelector('.upload-card label').innerHTML =
                `<strong>No questions loaded.</strong> Select a JSON file to start a session.`;
            quizContainer.innerHTML = '';
            resultsContainer.style.display = 'none';
            submitBtn.style.display = 'none';
            retryBtn.style.display = 'none';
            downloadReportBtn.style.display = 'none';
            unansweredWarning.style.display = 'none';
            currentQuestions = [];
            lastGradeResults = [];
        }
    </script>

</body>

</html>
